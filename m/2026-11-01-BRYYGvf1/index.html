<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Ensaio</title><style>
:root{--bg:#fbfaf7;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e6e3dc;--chord:#a3261f;--accent:#1f5fa8}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1d1d20;--ink:#ececef;--mute:#a0a0a8;--line:#2e2e33;--chord:#ff7b6e;--accent:#79aef2}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
header{padding:18px 16px 8px}h1{font-size:1.25rem;margin:0}.sub{color:var(--mute);font-size:.9rem}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 12px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
nav a{flex:none;font-size:.8rem;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--card)}
main{padding:12px 16px 40px;max-width:760px;margin:0 auto}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0;scroll-margin-top:64px}
.moment{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
h2{font-size:1.05rem;margin:2px 0 6px}.tom{display:inline-block;font-weight:700;color:var(--chord);font-size:.9rem}
.tom small{font-weight:400;color:var(--mute)}audio{width:100%;margin:10px 0 4px}
.ctl{display:flex;gap:6px;flex-wrap:wrap}.ctl button{font:inherit;font-size:.85rem;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ctl button.on{border-color:var(--accent);color:var(--accent)}.norec{color:var(--mute);font-size:.85rem;margin:8px 0}
pre{font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;margin:10px 0 0;white-space:pre}
.ch{color:var(--chord);font-weight:700}.src{font-size:.75rem;color:var(--mute);margin-top:8px}.src a{color:var(--mute)}
</style></head><body><header><h1>Ensaio</h1><div class="sub"></div></header><nav></nav><main></main><script src="../../viewer.js"></script></body></html>
